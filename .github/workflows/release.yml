name: 🚀 Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

# After a release, bump version and sha256 in Corkscrews/homebrew-tap (Casks/fruit-screensaver.rb).

jobs:
  build-and-release:
    if: ${{ github.event.repository.fork == false }}
    name: 🚀 Build and Release .saver
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: 🛠️ Set up Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: 🔢 Extract build number from xcodeproj
        id: extract_build_number
        run: |
          BUILD_NUMBER=$(./.github/scripts/extract_build_number.sh)
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT

      # A published release must never change: the Homebrew cask pins its tarball's sha256.
      - name: 🔍 Skip if this version is already released
        id: check_tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.extract_build_number.outputs.build_number }}" > /dev/null; then
            echo "::notice::Version ${{ steps.extract_build_number.outputs.build_number }} is already released. Bump MARKETING_VERSION to publish a new release."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: 💾 Cache DerivedData
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-xcode-deriveddata-${{ hashFiles('**/*.pbxproj', '**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-xcode-deriveddata-

      - name: 🏗️ Build .saver
        if: steps.check_tag.outputs.exists == 'false'
        run: ./.github/scripts/build.sh

      - name: 📦 Zip .saver
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          cd build
          tar -czf Fruit.saver.tar.gz Fruit.saver

      - name: 📝 Extract changelog for build_number
        if: steps.check_tag.outputs.exists == 'false'
        id: extract_changelog
        run: |
          CHANGELOG=$(./.github/scripts/extract_changelog.sh ${{ steps.extract_build_number.outputs.build_number }})
          echo 'changelog<<EOF' >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

      - name: 🏷️ Create Release Tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.extract_build_number.outputs.build_number }}
          git push origin ${{ steps.extract_build_number.outputs.build_number }}

      - name: ⬆️ Upload .saver to Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          files: build/Fruit.saver.tar.gz
          tag_name: ${{ steps.extract_build_number.outputs.build_number }}
          name: "Release ${{ steps.extract_build_number.outputs.build_number }}"
          body: ${{ steps.extract_changelog.outputs.changelog }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
